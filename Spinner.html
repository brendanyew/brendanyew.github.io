<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Choose a Color</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
    }

    button {
      padding: 15px 30px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      margin-top: 30px;
      font-size: 32px;
      font-weight: bold;
    }

    #message {
      margin-top: 10px;
      font-size: 20px;
      color: gray;
    }

    #instructions {
      font-size: 18px;
      margin-bottom: 20px;
    }

    /* LOCKED STATE */
    #transfer {
      display: block;
      margin-top: 40px;
      font-size: 18px;
      color: gray;
      text-decoration: none;
      pointer-events: none;
      opacity: 0.5;
    }

    /* UNLOCKED MOMENT */
    #transfer.active {
      color: blue;
      pointer-events: auto;
      opacity: 1;
      text-decoration: underline;
      cursor: pointer;
    }

    #popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
    }

    #popupBox {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 10px;
      width: 320px;
    }

    #popupText {
      font-size: 18px;
      margin-bottom: 20px;
    }

    #codeInput {
      padding: 8px;
      width: 60%;
      margin-right: 5px;
    }

    #copyBtn {
      cursor: pointer;
      font-size: 18px;
    }

    #error {
      color: red;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <div id="instructions">Complete the tasks to unlock the link.</div>
  
  <button onclick="pickColor('Red')">Red</button>
  <button onclick="pickColor('Blue')">Blue</button>

  <div id="result">-</div>
  <div id="message">Pick a color to start</div>

  <!-- Active link that triggers the popup -->
  <a id="transfer" class="active" href="#" onclick="openPopup(event)">Transfer Money</a>

  <!-- Popup Box -->
  <div id="popup">
    <div id="popupBox">
      <div id="popupText">Enter Code: <span id="copyBtn" onclick="copyCode()">📋</span></div>
      <input type="text" id="codeInput" placeholder="Enter transfer code...">
      <button onclick="verifyCode()">→</button>
      <div id="error"></div>
      <button onclick="closePopup()" style="margin-top: 15px; padding: 5px 15px; font-size: 14px;">Cancel</button>
    </div>
  </div>

  <footer>Sponsored by neal.fun</footer>

  <script>
    function pickColor(color) {
      document.getElementById('result').innerText = color;
      document.getElementById('message').innerText = "You selected " + color;
    }

    function openPopup(e) {
      e.preventDefault();
      document.getElementById('popup').style.display = 'flex';
    }

    function closePopup() {
      document.getElementById('popup').style.display = 'none';
      document.getElementById('codeInput').value = '';
      document.getElementById('error').style.display = 'none';
    }

    function verifyCode() {
      const input = document.getElementById('codeInput').value;
      const errorDiv = document.getElementById('error');
      
      if (input === 'Brendan') {
        errorDiv.innerText = "ACCESS GRANTED";
        errorDiv.style.color = "green";
        errorDiv.style.display = 'block';
        
        setTimeout(() => {
          alert("Talk to Brendan Yew (Owner of this website) to get your $500K");
        }, 1000);
      } else {
        errorDiv.innerText = "INCORRECT CODE";
        errorDiv.style.color = "red";
        errorDiv.style.display = 'block';
      }
    }

    function copyCode() {
      navigator.clipboard.writeText("Brendan");
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerText = "✔️";
      
      setTimeout(() => {
        copyBtn.innerText = "📋";
      }, 1000);
    }
  </script>
</body>
</html>
