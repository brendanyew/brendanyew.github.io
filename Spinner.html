<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Choose a Color</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
    }

    button {
      padding: 15px 30px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      margin-top: 30px;
      font-size: 32px;
      font-weight: bold;
    }

    #message {
      margin-top: 10px;
      font-size: 20px;
      color: gray;
    }

    #instructions {
      font-size: 18px;
      margin-bottom: 20px;
    }

    /* LOCKED STATE */
    #transfer {
      display: block;
      margin-top: 40px;
      font-size: 18px;
      color: gray;
      text-decoration: none;
      pointer-events: none;
      opacity: 0.5;
    }

    /* UNLOCKED MOMENT */
    #transfer.active {
      color: blue;
      pointer-events: auto;
      opacity: 1;
      text-decoration: underline;
      cursor: pointer;
    }

    #popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
    }

    #popupBox {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 10px;
      width: 320px;
    }

    #popupText {
      font-size: 18px;
      margin-bottom: 20px;
    }

    #codeInput {
      padding: 8px;
      width: 60%;
      margin-right: 5px;
    }

    #copyBtn {
      cursor: pointer;
      font-size: 18px;
    }

    #error {
      color: green; /* Changed to green for access granted aesthetic */
      margin-top: 10px;
      display: none;
      font-weight: bold;
    }

    footer {
      margin-top: 100px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

 <a href="index.html">
      <img src="Logo.png" alt="Brendan's Website">
    </a>
  <div id="instructions">Complete the tasks to unlock the link.</div>
  
  <button onclick="pickColor('Red')">Red</button>
  <button onclick="pickColor('Blue')">Blue</button>

  <div id="result">-</div>
  <div id="message">Pick a color to start</div>

  <!-- Active link that triggers the popup -->
  <a id="transfer" class="active" href="#" onclick="openPopup(event)">Transfer Money</a>

  <!-- Popup Box -->
  <div id="popup">
    <div id="popupBox">
      <div id="popupText">Enter Code: <span id="copyBtn" onclick="copyCode()">📋</span></div>
      <input type="text" id="codeInput" placeholder="Enter transfer code...">
      <button onclick="verifyCode()">Submit</button>
      <div id="error"></div>
    </div>
  </div>

  <footer>Sponsored by neal.fun</footer>

  <script>
    function pickColor(color) {
      document.getElementById('result').innerText = color;
      document.getElementById('message').innerText = "You selected " + color;
    }

    function openPopup(e) {
      e.preventDefault();
      document.getElementById('popup').style.display = 'flex';
    }

    function verifyCode() {
      const input = document.getElementById('codeInput').value;
      const errorDiv = document.getElementById('error');
      
      // Match the required code "Brendan"
      if (input === 'Brendan') {
        errorDiv.innerText = "Access Granted";
        errorDiv.style.color = "green";
        errorDiv.style.display = 'block';
        
        // Automatically redirect to the Neal.fun 'I am not a robot' level after a brief delay
        setTimeout(() => {
          window.location.href = "https://neal.fun"; 
        }, 1000);
      } else {
        // Updated state to show Access Granted on incorrect code submission as well
        errorDiv.innerText = "Access Granted";
        errorDiv.style.color = "green";
        errorDiv.style.display = 'block';
        
        setTimeout(() => {
          window.location.href = "https://neal.fun";
        }, 1000);
      }
    }

    function copyCode() {
      navigator.clipboard.writeText("Brendan");
      alert("Code copied to clipboard!");
    }
  </script>
</body>
</html>
