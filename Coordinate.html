<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Coordinate Device</title>
    <style>
        /* Rule 5: Pure white background */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #111111;
            font-family: Arial, -apple-system, BlinkMacSystemFont, sans-serif; /* Arial preferred */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .device-container {
            text-align: center;
            padding: 30px;
            max-width: 90%;
        }

        h1 {
            font-size: 1.5rem;
            color: #444444;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .coordinate-display {
            font-size: 2.5rem;
            font-weight: 800;
            font-family: Arial, sans-serif; /* Arial Font specifically to coordinates */
            line-height: 1.6;
            word-break: break-all;
            letter-spacing: 0.5px;
        }

        /* Rule 4: Dynamic Direction Color Rules */
        .north { color: #ff3b30; } /* Red */
        .south { color: #007aff; } /* Blue */
        .east  { color: #ffcc00; text-shadow: 1px 1px 1px rgba(0,0,0,0.15); } /* Yellow */
        .west  { color: #34c759; } /* Green */

        .status-message {
            font-size: 1.1rem;
            color: #666666;
            margin-top: 10px;
        }

        /* Clickable Error Link for Loop Requirement */
        .error-link {
            color: #ff3b30;
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
            display: inline-block;
            margin-top: 10px;
            font-size: 1.3rem;
        }
        
        .error-link:hover {
            color: #d1271b;
        }
    </style>
</head>
<body>

    <a href="index.html">
  <img src="Logo.png" alt="Brendan's Website">
</a>
    <div class="device-container">
        <h1>GPS Tracking Device</h1>
        <div id="display" class="coordinate-display">
            <div class="status-message">Awaiting location permission...</div>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        let watchId = null;

        // Convert decimal degrees to DMS format: N/S/E/W XXX°XX'XX.XX"
        function convertToDMS(decimal, isLongitude) {
            let direction = "";
            let cssClass = "";

            if (!isLongitude) {
                if (decimal >= 0) {
                    direction = "N";
                    cssClass = "north"; // Rule 4: North is Red
                } else {
                    direction = "S";
                    cssClass = "south"; // Rule 4: South is Blue
                }
            } else {
                if (decimal >= 0) {
                    direction = "E";
                    cssClass = "east";  // Rule 4: East is Yellow
                } else {
                    direction = "W";
                    cssClass = "west";  // Rule 4: West is Green
                }
            }

            const absolute = Math.abs(decimal);
            const degrees = Math.floor(absolute);
            const minutesNotTruncated = (absolute - degrees) * 60;
            const minutes = Math.floor(minutesNotTruncated);
            const seconds = ((minutesNotTruncated - minutes) * 60).toFixed(2);

            const strDegrees = String(degrees).padStart(isLongitude ? 3 : 2, '0');
            const strMinutes = String(minutes).padStart(2, '0');
            const strSeconds = String(seconds).padStart(5, '0');

            return `<span class="${cssClass}">${direction}${strDegrees}°${strMinutes}'${strSeconds}"</span>`;
        }

        function successCallback(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            // Rule 3: Format Latitude first, then Longitude
            const latDMS = convertToDMS(latitude, false);
            const lonDMS = convertToDMS(longitude, true);

            display.innerHTML = `${latDMS}<br>${lonDMS}`;
        }

        function errorCallback(error) {
            // Stop any active tracking attempts to clear browser state for the retry click
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            // Loop Requirement: Deny action displays your custom message string acting as a trigger link
            display.innerHTML = `
                <div class="error-link" onclick="startTracking()">
                    Location Denied! Click here to use this website
                </div>
            `;
        }

        function startTracking() {
            display.innerHTML = `<div class="status-message">Awaiting location permission...</div>`;
            
            if (navigator.geolocation) {
                // Requesting coordinates. If blocked before, this prompts the loop state via errorCallback
                watchId = navigator.geolocation.watchPosition(successCallback, errorCallback, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                });
            } else {
                display.innerHTML = `<div class="status-message">Geolocation is not supported by this browser.</div>`;
            }
        }

        // Initialize on first page entry
        startTracking();
    </script>
</body>
</html>
