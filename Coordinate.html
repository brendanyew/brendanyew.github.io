<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Coordinate Device</title>
    <style>
        /* Rule 5: Pure white background */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #111111;
            font-family: Arial, -apple-system, BlinkMacSystemFont, sans-serif; /* Arial preferred */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .device-container {
            text-align: center;
            padding: 30px;
            max-width: 90%;
        }

        h1 {
            font-size: 1.5rem;
            color: #444444;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Sub-heading Status Styles */
        .gps-status {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-on { color: #30d158; }  /* Light Green */
        .status-off { color: #ff3b30; } /* Bright Red */

        /* Psychological Battery Badge Style */
        .battery-badge {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 0.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #30d158; /* Bright Green */
        }

        /* Connection Reminder Text Styles */
        .connection-status {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .conn-online { color: #007aff; }  /* Bright Blue (#007aff) */
        .conn-offline { color: #ff3b30; } /* Bright Red */

        .coordinate-display {
            font-size: 2.5rem;
            font-weight: 800;
            font-family: Arial, sans-serif; /* Arial Font specifically to coordinates */
            line-height: 1.6;
            word-break: break-all;
            letter-spacing: 0.5px;
        }

        /* Rule 4: Dynamic Direction Color Rules */
        .north { color: #ff3b30; } /* Red */
        .south { color: #007aff; } /* Blue (#007aff) */
        .east  { color: #ffcc00; text-shadow: 1px 1px 1px rgba(0,0,0,0.15); } /* Yellow */
        .west  { color: #34c759; } /* Green (#34c759) */

        .status-message {
            font-size: 1.1rem;
            color: #666666;
            margin-top: 10px;
        }

        /* Clickable Error Link for Loop Requirement */
        .error-link {
            color: #ff3b30;
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
            display: inline-block;
            margin-top: 10px;
            font-size: 1.3rem;
        }
        
        .error-link:hover {
            color: #d1271b;
        }
    </style>
</head>
<body>

    <a href="index.html">
  <img src="Logo.png" alt="Brendan's Website">
</a>
    <div class="device-container">
        <h1>GPS Tracking Device</h1>
        <div id="gpsStatus" class="gps-status status-off">GPS Off</div>
        <!-- Permanent decorative badge: Placed under GPS On/Off and above connection status -->
        <div class="battery-badge">Battery Saving Mode On</div>
        <div id="connectionStatus" class="connection-status conn-offline">No Connection</div>
        
        <div id="display" class="coordinate-display">
            <div class="status-message">Awaiting location permission...</div>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const gpsStatus = document.getElementById('gpsStatus');
        const connectionStatus = document.getElementById('connectionStatus');
        let watchId = null;

        // Monitor and update connection indicator text purely as a reminder layout element
        function updateNetworkStatus() {
            if (navigator.onLine) {
                connectionStatus.textContent = "No Service";
                connectionStatus.className = "connection-status conn-online";
            } else {
                connectionStatus.textContent = "No Connection";
                connectionStatus.className = "connection-status conn-offline";
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        // Convert decimal degrees to DMS format: N/S/E/W XXX°XX'XX.XXXX"
        function convertToDMS(decimal, isLongitude) {
            let direction = "";
            let cssClass = "";

            if (!isLongitude) {
                if (decimal >= 0) {
                    direction = "N";
                    cssClass = "north";
                } else {
                    direction = "S";
                    cssClass = "south";
                }
            } else {
                if (decimal >= 0) {
                    direction = "E";
                    cssClass = "east";
                } else {
                    direction = "W";
                    cssClass = "west";
                }
            }

            const absolute = Math.abs(decimal);
            const degrees = Math.floor(absolute);
            const minutesNotTruncated = (absolute - degrees) * 60;
            const minutes = Math.floor(minutesNotTruncated);
            
            // Keeps 4 decimal places for maximum millimetric precision
            const seconds = ((minutesNotTruncated - minutes) * 60).toFixed(4);

            const strDegrees = String(degrees).padStart(isLongitude ? 3 : 2, '0');
            const strMinutes = String(minutes).padStart(2, '0');
            const strSeconds = String(seconds).padStart(7, '0');

            return `<span class="${cssClass}">${direction}${strDegrees}°${strMinutes}'${strSeconds}"</span>`;
        }

        function successCallback(position) {
            gpsStatus.textContent = "GPS On";
            gpsStatus.className = "gps-status status-on";

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            const latDMS = convertToDMS(latitude, false);
            const lonDMS = convertToDMS(longitude, true);

            display.innerHTML = `${latDMS}<br>${lonDMS}`;
        }

        function errorCallback(error) {
            gpsStatus.textContent = "GPS Off";
            gpsStatus.className = "gps-status status-off";

            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            display.innerHTML = `
                <div class="error-link" onclick="startTracking()">
                    Location Denied! Click here to use this website
                </div>
            `;
        }

        function startTracking() {
            display.innerHTML = `<div class="status-message">Awaiting location permission...</div>`;
            
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(successCallback, errorCallback, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                });
            } else {
                display.innerHTML = `<div class="status-message">Geolocation is not supported by this browser.</div>`;
            }
        }

        // Initialize state indicators together on application launch
        updateNetworkStatus();
        startTracking();
    </script>
</body>
</html>
