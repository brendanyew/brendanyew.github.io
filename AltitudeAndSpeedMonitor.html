<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garmin PFD Tapes - Zero Centered</title>
    <style>
        :root {
            --bg-color: #0b0d11;
            --panel-bg: #12161c;
            --border-color: #4a525d;
            --text-color: #ffffff;
            --accent-green: #00ff00;
            --tape-width: 95px;
            --tape-height: 380px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial Black', 'Impact', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .pfd-container {
            display: flex;
            gap: 120px;
            padding: 30px 40px;
            background: #181d24;
            border: 5px solid #2d3440;
            border-radius: 8px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            position: relative;
        }

        .column-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .column-header {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #a2afc2;
        }

        .tape-window {
            width: var(--tape-width);
            height: var(--tape-height);
            background: var(--panel-bg);
            border: 3px solid var(--border-color);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
            cursor: ns-resize;
            
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        .tape-strip {
            position: absolute;
            width: 100%;
            left: 0;
            transition: transform 0.15s cubic-bezier(0.1, 0.8, 0.2, 1);
            will-change: transform;
        }

        .tick-item {
            position: absolute;
            width: 100%;
            height: 60px; /* Precise layout spacing per tick */
            display: flex;
            align-items: center;
            box-sizing: border-box;
        }

        .speed-tape .tick-item {
            justify-content: flex-end;
            padding-right: 32px;
        }

        .altitude-tape .tick-item {
            justify-content: flex-start;
            padding-left: 32px;
        }

        .tick-text {
            font-size: 22px;
            font-weight: 900;
            color: #e2e8f0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .tick-mark {
            position: absolute;
            height: 3px;
            background: #8a96a8;
        }

        .speed-tape .tick-mark {
            right: 0;
            width: 18px;
        }

        .altitude-tape .tick-mark {
            left: 0;
            width: 18px;
        }

        /* Central overlay window box framing target readout text elements */
        .current-box {
            position: absolute;
            top: calc(50% - 24px);
            width: calc(var(--tape-width) + 14px);
            height: 48px;
            background: #000000;
            border: 3px solid #ffffff;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }

        .speed-tape .current-box {
            right: -7px;
            border-radius: 4px 0 0 4px;
        }

        .altitude-tape .current-box {
            left: -7px;
            border-radius: 0 4px 4px 0;
        }

        .current-value {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        /* Utility interaction fields layout wrapper */
        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            gap: 30px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #181d24;
            padding: 8px 16px;
            border-radius: 6px;
            border: 2px solid #3e4654;
        }

        .control-group label {
            font-size: 13px;
            font-weight: bold;
            color: #a2afc2;
        }

        .control-group input {
            width: 80px;
            background: #000000;
            border: 1px solid #555;
            color: var(--accent-green);
            font-size: 18px;
            padding: 4px;
            font-weight: 900;
            border-radius: 4px;
            text-align: center;
        }
        
        .hint-text {
            color: #5a6575;
            font-size: 13px;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="hint-text">💡 SCROLL OVER TAPES OR ADJUST BOXES BELOW TO TEST NEGATIVES</div>

    <div class="pfd-container">
        <!-- SPEED (LEFT) -->
        <div class="column-wrapper">
            <div class="column-header">SPEED (KM/H)</div>
            <div class="tape-window speed-tape" id="speedWindow">
                <div class="current-box">
                    <div class="current-value" id="speedDisplay">0</div>
                </div>
                <div class="tape-strip" id="speedStrip"></div>
            </div>
        </div>

        <!-- ALTITUDE (RIGHT) -->
        <div class="column-wrapper">
            <div class="column-header">ALTITUDE (M)</div>
            <div class="tape-window altitude-tape" id="altitudeWindow">
                <div class="current-box">
                    <div class="current-value" id="altitudeDisplay">0</div>
                </div>
                <div class="tape-strip" id="altitudeStrip"></div>
            </div>
        </div>
    </div>

    <!-- UTILITY CONTROL DECK FOR EASY TESTING -->
    <div class="controls">
        <div class="control-group">
            <label>SPEED DIAL:</label>
            <input type="number" id="speedInput" value="0" min="-50" max="50">
        </div>
        <div class="control-group">
            <label>ALTITUDE DIAL:</label>
            <input type="number" id="altInput" value="0" min="-50" max="50">
        </div>
    </div>

    <script>
        const config = {
            pixelsPerUnit: 6, // 60px step heights per 10 unit intervals
            interval: 10,
            windowHeight: 380,
            minLimit: -50,
            maxLimit: 50
        };

        // Standardized system trackers launch sitting perfectly on 0
        let currentSpeed = 0;
        let currentAltitude = 0;

        const speedStrip = document.getElementById('speedStrip');
        const altitudeStrip = document.getElementById('altitudeStrip');
        const speedDisplay = document.getElementById('speedDisplay');
        const altitudeDisplay = document.getElementById('altitudeDisplay');
        const speedInput = document.getElementById('speedInput');
        const altInput = document.getElementById('altInput');

        function initTapes() {
            // Generates a structural loop tracking limits explicitly from -50 up to +50
            for (let val = config.minLimit; val <= config.maxLimit; val += config.interval) {
                // Calculate position relative to a zeroed center floor shift anchor
                const offsetFromZero = val * config.pixelsPerUnit;
                
                // SPEED ELEMENT BUILD
                const sItem = document.createElement('div');
                sItem.className = 'tick-item';
                sItem.style.bottom = `calc(50% + ${offsetFromZero}px - 30px)`; // Center aligned box offset calculation logic
                sItem.innerHTML = `<span class="tick-text">${val}</span><div class="tick-mark"></div>`;
                speedStrip.appendChild(sItem);

                // ALTITUDE ELEMENT BUILD
                const aItem = document.createElement('div');
                aItem.className = 'tick-item';
                aItem.style.bottom = `calc(50% + ${offsetFromZero}px - 30px)`;
                aItem.innerHTML = `<div class="tick-mark"></div><span class="tick-text">${val}</span>`;
                altitudeStrip.appendChild(aItem);
            }
        }

        function updateDisplay() {
            // Smoothly shift container track strips depending on target selection states
            const speedY = currentSpeed * config.pixelsPerUnit;
            speedStrip.style.transform = `translateY(${speedY}px)`;
            speedDisplay.textContent = Math.round(currentSpeed);
            speedInput.value = Math.round(currentSpeed);

            const altY = currentAltitude * config.pixelsPerUnit;
            altitudeStrip.style.transform = `translateY(${altY}px)`;
            altitudeDisplay.textContent = Math.round(currentAltitude);
            altInput.value = Math.round(currentAltitude);
        }

        // Mouse wheel scroll adjustments configurations updates hooks
        document.getElementById('speedWindow').addEventListener('wheel', (e) => {
            e.preventDefault();
            currentSpeed = Math.max(config.minLimit, Math.min(config.maxLimit, currentSpeed - e.deltaY * 0.05));
            updateDisplay();
        });

        document.getElementById('altitudeWindow').addEventListener('wheel', (e) => {
currentAltitude = Math.max(config.minLimit, Math.min(config.maxLimit, currentAltitude - e.deltaY * 0.05));
updateDisplay();
});
speedInput.addEventListener('input', (e) => {
let val = parseFloat(e.target.value) || 0;
currentSpeed = Math.max(config.minLimit, Math.min(config.maxLimit, val));
updateDisplay();
});
altInput.addEventListener('input', (e) => {
let val = parseFloat(e.target.value) || 0;
currentAltitude = Math.max(config.minLimit, Math.min(config.maxLimit, val));
updateDisplay();
});
initTapes();
updateDisplay();
