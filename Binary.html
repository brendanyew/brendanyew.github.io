<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truly Infinite Binary Grid</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; font-size: 1.8rem; }
        p { color: #94a3b8; margin-top: 0; margin-bottom: 25px; text-align: center; max-width: 500px; font-size: 0.95rem; }
        .controls {
            background: #1e293b;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        label { font-weight: 600; color: #cbd5e1; }
        input {
            background: #0f172a;
            border: 2px solid #475569;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 1rem;
            width: 140px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #38bdf8; }
        .grid-container {
            width: 100%;
            max-width: 1200px;
            background: #1e293b;
            border-radius: 16px;
            padding: 20px 0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
            overflow-x: auto;
            cursor: grab;
            user-select: none;
        }
        .grid-container:active { cursor: grabbing; }
        .grid-track {
            display: flex;
            width: 100000px; /* Massive virtual width to allow scrolling */
            position: relative;
            height: 140px;
        }
        .column {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90px;
            position: absolute;
            top: 0;
            border-right: 1px dashed #334155;
            box-sizing: border-box;
        }
        .column.radix-point {
            width: 40px;
            justify-content: center;
            border-right: none;
            color: #ef4444;
            font-size: 3rem;
            font-weight: bold;
            line-height: 1;
            padding-top: 15px;
        }
        .column.radix-point .label {
            position: absolute;
            bottom: 5px;
            font-size: 0.7rem;
            color: #f87171;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .header-val {
            font-size: 0.85rem;
            color: #38bdf8;
            font-weight: bold;
            height: 35px;
            text-align: center;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 4px;
            box-sizing: border-box;
        }
        .bit-box {
            width: 55px;
            height: 55px;
            border-radius: 10px;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: bold;
            margin: 10px 0;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        .bit-box.active {
            background: #0ea5e9;
            color: #fff;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.5);
            transform: scale(1.05);
        }
        .multiplier {
            font-size: 0.75rem;
            color: #64748b;
        }
        .binary-string {
            margin-top: 30px;
            font-family: monospace;
            font-size: 1.4rem;
            background: #0f172a;
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid #334155;
            color: #38bdf8;
            word-break: break-all;
            max-width: 90%;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Infinite Binary Scroll Visualiser</h1>
    <p>Drag horizontally endlessly. Columns will calculate dynamically out into infinite powers of 2!</p>

    <div class="controls">
        <label for="decimalInput">Decimal Number:</label>
        <input type="number" id="decimalInput" value="13.5" step="any">
    </div>

    <div class="grid-container" id="scrollContainer">
        <div class="grid-track" id="gridTrack">
            <!-- Radix point is our spatial baseline anchor -->
            <div class="column radix-point" id="radixPoint" style="left: 50000px;">
                <span>.</span>
                <div class="label">Point</div>
            </div>
        </div>
    </div>

    <div class="binary-string" id="binaryOutput">Binary: 1101.1</div>

    <script>
        const input = document.getElementById('decimalInput');
        const track = document.getElementById('gridTrack');
        const container = document.getElementById('scrollContainer');
        const output = document.getElementById('binaryOutput');
        const radixPoint = document.getElementById('radixPoint');

        const COL_WIDTH = 90;
        const RADIX_WIDTH = 40;
        const RADIX_CENTER_X = 50000; 

        let activeColumns = new Map();

        function getBitAtPower(val, power) {
            let wholePart = Math.floor(val);
            let fracPart = val - wholePart;

            if (power >= 0) {
                // Shift down to target bit layout position
                return (wholePart >> power) & 1;
            } else {
                let tempFrac = fracPart;
                let bit = 0;
                let currentPower = -1;
                
                // Track standard base-2 scaling multiplication loop
                while (currentPower >= power) {
                    tempFrac *= 2;
                    if (tempFrac >= 1) {
                        bit = 1;
                        tempFrac -= 1;
                    } else {
                        bit = 0;
                    }
                    if (currentPower === power) return bit;
                    currentPower--;
                }
            }
            return 0;
        }

        function formatHeader(power) {
            if (power >= 0) {
                if (power > 10) return `2^${power}`;
                return Math.pow(2, power).toLocaleString();
            } else {
                const absP = Math.abs(power);
                if (absP > 6) return `1/(2^${absP})`;
                return (1 / Math.pow(2, absP)).toString();
            }
        }

        function renderVisibleRange() {
            const currentVal = parseFloat(input.value) || 0;
            const scrollLeft = container.scrollLeft;
            const containerWidth = container.offsetWidth;
            
            // Generate window view dimensions dynamically to spawn headers ahead of viewport layout
            const startX = scrollLeft - 200;
            const endX = scrollLeft + containerWidth + 200;

            const minPower = Math.ceil((RADIX_CENTER_X + RADIX_WIDTH - endX) / COL_WIDTH) * -1;
            const maxPower = Math.floor((RADIX_CENTER_X - startX) / COL_WIDTH);

            let renderedKeys = new Set();

            for (let p = minPower; p <= maxPower; p++) {
                renderedKeys.add(p);

                let xPos = 0;
                if (p >= 0) {
                    xPos = RADIX_CENTER_X - ((p + 1) * COL_WIDTH);
                } else {
                    xPos = RADIX_CENTER_X + RADIX_WIDTH + ((Math.abs(p) - 1) * COL_WIDTH);
                }

                const bit = getBitAtPower(currentVal, p);
                const heading = formatHeader(p);
                const multiplier = p >= 0 ? (p === 0 ? "" : "×2 ←") : "→ /2";

                if (activeColumns.has(p)) {
                    const colEl = activeColumns.get(p);
                    const box = colEl.querySelector('.bit-box');
                    box.textContent = bit;
                    if (bit) box.classList.add('active');
                    else box.classList.remove('active');
                } else {
                    const col = document.createElement('div');
                    col.className = 'column';
                    col.style.left = `${xPos}px`;
                    col.innerHTML = `
                        <div class="header-val" title="${heading}">${heading}</div>
                        <div class="bit-box ${bit ? 'active' : ''}">${bit}</div>
                        <div class="multiplier">${multiplier}</div>
                    `;
                    track.appendChild(col);
                    activeColumns.set(p, col);
                }
            }

            // Flush old columns to keep scrolling snappy and lightweight
            for (let [p, el] of activeColumns.entries()) {
                if (!renderedKeys.has(p)) {
                    el.remove();
                    activeColumns.delete(p);
                }
            }
        }

        function updateBinaryString() {
            const val = parseFloat(input.value) || 0;
            let whole = Math.floor(val).toString(2);
            let frac = val - Math.floor(val);
            let fracStr = "";
            
            if (frac > 0) {
                let temp = frac;
                for (let i = 0; i < 12; i++) {
                    temp *= 2;
                    if (temp >= 1) { fracStr += "1"; temp -= 1; }
                    else { fracStr += "0"; }
                }
                fracStr = fracStr.replace(/0+$/, '');
            }
output.innerHTML = Binary Output: <strong>${whole}${fracStr ? '.' + fracStr : ''}</strong>;
}
// Drag to Scroll functionality mapping
let isDown = false;
let startX, sLeft;
container.addEventListener('mousedown', (e) => {
isDown = true;
startX = e.pageX - container.offsetLeft;
sLeft = container.scrollLeft;
});
container.addEventListener('mouseleave', () => isDown = false);
container.addEventListener('mouseup', () => isDown = false);
container.addEventListener('mousemove', (e) => {
if (!isDown) return;
e.preventDefault();
const x = e.pageX - container.offsetLeft;
const walk = (x - startX) * 1.5;
container.scrollLeft = sLeft - walk;
renderVisibleRange();
});
container.addEventListener('scroll', renderVisibleRange);
input.addEventListener('input', () => {
renderVisibleRange();
updateBinaryString();
});
window.addEventListener('resize', renderVisibleRange);
// Move container canvas to midpoint anchor line on deployment step
container.scrollLeft = RADIX_CENTER_X - (container.offsetWidth / 2) + (RADIX_WIDTH / 2);
renderVisibleRange();
updateBinaryString();
                let isDown = false;
        let startX, sLeft;

        container.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - container.offsetLeft;
            sLeft = container.scrollLeft;
        });
        container.addEventListener('mouseleave', () => isDown = false);
        container.addEventListener('mouseup', () => isDown = false);
        container.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - container.offsetLeft;
            const walk = (x - startX) * 1.5;
            container.scrollLeft = sLeft - walk;
            renderVisibleRange();
        });

        container.addEventListener('scroll', renderVisibleRange);
        input.addEventListener('input', () => {
            renderVisibleRange();
            updateBinaryString();
        });

        window.addEventListener('resize', renderVisibleRange);
        
        // Move container canvas to midpoint anchor line on deployment step
        container.scrollLeft = RADIX_CENTER_X - (container.offsetWidth / 2) + (RADIX_WIDTH / 2);
        
        renderVisibleRange();
        updateBinaryString();
    </script>
</body>
</html>
