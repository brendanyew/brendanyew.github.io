<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Binary Grid Visualizer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; font-size: 1.8rem; }
        p { color: #94a3b8; margin-top: 0; margin-bottom: 25px; text-align: center; max-width: 500px; font-size: 0.95rem; }
        .controls {
            background: #1e293b;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        label { font-weight: 600; color: #cbd5e1; }
        input {
            background: #0f172a;
            border: 2px solid #475569;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 1rem;
            width: 140px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #38bdf8; }
        .grid-container {
            width: 100%;
            max-width: 1200px;
            background: #1e293b;
            border-radius: 16px;
            padding: 20px 0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
            overflow-x: auto;
            cursor: grab;
            user-select: none;
            scrollbar-width: auto;
        }
        .grid-container:active { cursor: grabbing; }
        .grid-track {
            display: flex;
            padding: 0 40px;
            width: max-content;
        }
        .column {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90px;
            flex-shrink: 0;
            border-right: 1px dashed #334155;
            position: relative;
        }
        .column.radix-point {
            width: 40px;
            justify-content: center;
            border-right: none;
            color: #ef4444;
            font-size: 3rem;
            font-weight: bold;
            line-height: 1;
            padding-top: 15px;
        }
        .column.radix-point .label {
            position: absolute;
            bottom: 5px;
            font-size: 0.7rem;
            color: #f87171;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .header-val {
            font-size: 0.85rem;
            color: #38bdf8;
            font-weight: bold;
            height: 35px;
            text-align: center;
            word-break: break-all;
            padding: 0 4px;
        }
        .bit-box {
            width: 55px;
            height: 55px;
            border-radius: 10px;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: bold;
            margin: 15px 0;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        .bit-box.active {
            background: #0ea5e9;
            color: #fff;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.5);
            transform: scale(1.05);
        }
        .multiplier {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 5px;
        }
        .binary-string {
            margin-top: 30px;
            font-family: monospace;
            font-size: 1.4rem;
            background: #0f172a;
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid #334155;
            color: #38bdf8;
        }
        .binary-string span { color: #94a3b8; font-size: 1rem; }
    </style>
</head>
<body>

<a href="index.html">
  <img src="Logo.png" alt="Brendan's Website">
</a>
    <h1>Infinite Binary Scroll Visualiser</h1>
    <p>Type a decimal number below, then click and drag the table horizontally to scroll through the place values forever!</p>

    <div class="controls">
        <label for="decimalInput">Decimal Number:</label>
        <input type="number" id="decimalInput" value="13.5" step="any" min="0">
    </div>

    <div class="grid-container" id="scrollContainer">
        <div class="grid-track" id="gridTrack">
            <!-- Dynamically populated via JS -->
        </div>
    </div>

    <div class="binary-string" id="binaryOutput">Binary: 1101.1</div>

    <script>
        const input = document.getElementById('decimalInput');
        const track = document.getElementById('gridTrack');
        const container = document.getElementById('scrollContainer');
        const output = document.getElementById('binaryOutput');

        // Configuration limits for the visual engine (effectively infinite scrolling)
        const LEFT_BITS = 30;  // Up to 536,870,912
        const RIGHT_BITS = 30; // Down to 1/536,870,912

        function updateGrid() {
            const val = parseFloat(input.value) || 0;
            track.innerHTML = '';

            let wholePart = Math.floor(val);
            let fracPart = val - wholePart;

            // Generate Columns Left of Decimal (Whole Numbers)
            const leftCols = [];
            for (let i = LEFT_BITS - 1; i >= 0; i--) {
                const placeValue = Math.pow(2, i);
                const bit = (wholePart >= placeValue) ? 1 : 0;
                if (bit === 1) wholePart -= placeValue;

                leftCols.push({
                    heading: placeValue.toLocaleString(),
                    bit: bit,
                    mult: i === 0 ? "" : "×2 ←"
                });
            }
            
            // Trim leading zeros visually to center the active view, but keep a structural buffer
            let firstActive = leftCols.findIndex(c => c.bit === 1);
            if (firstActive === -1) firstActive = LEFT_BITS - 4; // default view window fallback
            const visibleLeft = leftCols.slice(Math.max(0, firstActive - 4));

            visibleLeft.forEach(col => {
                createColumnElement(col.heading, col.bit, col.mult);
            });

            // Insert Visual Radix Point (Decimal Dot)
            const dot = document.createElement('div');
            dot.className = 'column radix-point';
            dot.innerHTML = '<span>.</span><div class="label">Point</div>';
            track.appendChild(dot);

            // Generate Columns Right of Decimal (Fractions)
            let tempFrac = fracPart;
            const rightCols = [];
            for (let i = 1; i <= RIGHT_BITS; i++) {
                const placeValue = 1 / Math.pow(2, i);
                let bit = 0;
                
                // Use standard decimal multiplication strategy matching curriculum guidelines
                tempFrac *= 2;
                if (tempFrac >= 1) {
                    bit = 1;
                    tempFrac -= 1;
                }

                // Format nice fractional lookup strings (e.g. 0.5, 0.25)
                let displayValue = placeValue.toString();
                if (displayValue.length > 8) displayValue = `1/${Math.pow(2, i)}`;

                rightCols.push({
                    heading: displayValue,
                    bit: bit,
                    mult: "→ /2"
                });
            }

            // Find last active trailing bit to clean up structural infinity rendering
            let lastActive = rightCols.map(c => c.bit).lastIndexOf(1);
            if (lastActive === -1) lastActive = 3; 
            const visibleRight = rightCols.slice(0, Math.max(8, lastActive + 5));

            visibleRight.forEach(col => {
                createColumnElement(col.heading, col.bit, col.mult);
            });

            // Update bottom plain-text label output
            let binaryStr = visibleLeft.map(c => c.bit).join('').replace(/^0+/, '') || '0';
            let fracStr = visibleRight.map(c => c.bit).join('').replace(/0+$/, '');
            output.innerHTML = `Binary: <strong>${binaryStr}${fracStr ? '.' + fracStr : ''}</strong>`;
        }

        function createColumnElement(heading, bit, multiplier) {
            const col = document.createElement('div');
            col.className = 'column';
            
            col.innerHTML = `
                <div class="header-val">${heading}</div>
                <div class="bit-box ${bit ? 'active' : ''}">${bit}</div>
                <div class="multiplier">${multiplier}</div>
            `;
            track.appendChild(col);
        }

        // Drag to Scroll satisfying implementation
        let isDown = false;
        let startX;
        let scrollLeft;

        container.addEventListener('mousedown', (e) => {
            isDown = true;
            container.classList.add('active');
            startX = e.pageX - container.offsetLeft;
            scrollLeft = container.scrollLeft;
        });
        container.addEventListener('mouseleave', () => {
            isDown = false;
        });
        container.addEventListener('mouseup', () => {
            isDown = false;
        });
        container.addEventListener('mousemove', (e) => {
            if(!isDown) return;
            e.preventDefault();
            const x = e.pageX - container.offsetLeft;
            const walk = (x - startX) * 1.5;
            container.scrollLeft = scrollLeft - walk;
        });

        input.addEventListener('input', updateGrid);
        
        // Initial build runtime execution
        updateGrid();
        // Center scroll window over the decimal point on page load
setTimeout(() => {
const dotElement = document.querySelector('.radix-point');
if (dotElement) {
container.scrollLeft = dotElement.offsetLeft - (container.offsetWidth / 2) + 20;
}
}, 50);

        // Initial build runtime execution
        updateGrid();
        // Center scroll window over the decimal point on page load
        setTimeout(() => {
            const dotElement = document.querySelector('.radix-point');
            if (dotElement) {
                container.scrollLeft = dotElement.offsetLeft - (container.offsetWidth / 2) + 20;
            }
        }, 50);
    </script>
</body>
</html>
