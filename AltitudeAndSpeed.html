<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Altitude and Speed Tracker</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 25px;
            min-width: 340px;
        }
        h1 {
            font-size: 1.4rem;
            color: #000000;
            margin-bottom: 20px;
            margin-top: 0;
            font-weight: bold;
        }
        .status-block {
            margin-bottom: 25px;
            font-size: 1rem;
            font-weight: bold;
            line-height: 1.6;
        }
        .gps-on { color: #00ff00; }
        .gps-off { color: #ff0000; }
        .battery-status { color: #00ff00; }
        .net-no-connect { color: #ff0000; }
        .net-sim { color: #00d2ff; }
        
        .metric {
            font-size: 2.5rem;
            font-weight: bold;
            color: #000000;
            margin: 15px 0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Your Current Altitude and Speed</h1>
        
        <!-- Status Display Area -->
        <div class="status-block">
            <div id="gps-status" class="gps-off">GPS OFF</div>
            <div class="battery-status">BATTERY SAVING MODE ON</div>
            <div id="network-status" class="net-no-connect">NO CONNECT</div>
        </div>

        <!-- Metrics Area -->
        <div class="metric" id="altitude-display">000000m</div>
        <div class="metric" id="speed-display">000000km/h</div>
    </div>

    <script>
        const gpsStatusEl = document.getElementById('gps-status');
        const networkStatusEl = document.getElementById('network-status');
        const altitudeEl = document.getElementById('altitude-display');
        const speedEl = document.getElementById('speed-display');

        function formatSixDigits(value) {
            let rounded = Math.max(0, Math.round(value));
            return String(rounded).padStart(6, '0');
        }

        // Checks user-agent characteristics and screen layouts to determine if it is a mobile phone
        function isPhoneDevice() {
            const hasMobileUA = /Mobi|Android|iPhone|iPod/i.test(navigator.userAgent);
            const isSmallScreen = Math.min(window.screen.width, window.screen.height) < 768;
            const hasTouch = ('ontouchstart' in window || navigator.maxTouchPoints > 0);
            
            // If the browser supports the experimental userAgentData interface, we look there too
            if (navigator.userAgentData && typeof navigator.userAgentData.mobile === 'boolean') {
                return navigator.userAgentData.mobile && isSmallScreen;
            }
            
            return hasMobileUA || (isSmallScreen && hasTouch);
        }

        function detectLocalCarrier() {
            try {
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
                const lang = navigator.language || "";

                if (tz.includes("Australia")) return "Telstra";
                if (tz.includes("America") || lang.includes("en-US")) return "Verizon";
                if (tz.includes("Europe/London") || lang.includes("en-GB")) return "EE";
                if (tz.includes("Tokyo") || lang.includes("ja")) return "NTT Docomo";
                if (tz.includes("Europe/Berlin") || lang.includes("de")) return "Telekom";
                if (tz.includes("Europe/Paris")) return "Orange";
                if (tz.includes("Calcutta") || lang.includes("en-IN")) return "Jio";
                return "Cellular Network";
            } catch (e) {
                return "Cellular";
            }
        }

        function updateNetworkStatus() {
            // 1. Explicitly check if offline
            if (!navigator.onLine) {
                networkStatusEl.textContent = "NO CONNECT";
                networkStatusEl.className = "net-no-connect";
                return;
            }

            // 2. Separate laptop/desktop context from handheld mobile devices
            if (!isPhoneDevice()) {
                networkStatusEl.textContent = "NO SERVICE";
                networkStatusEl.className = "net-sim";
                return;
            }

            // 3. Fallback mobile simulation block if it genuinely passes as a phone profile
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            
            if (connection && connection.type && connection.type !== 'cellular') {
                // If the phone is forced onto absolute non-mobile internet like fixed Ethernet bridging 
                networkStatusEl.textContent = "NO SERVICE";
                networkStatusEl.className = "net-sim";
            } else {
                const carrier = detectLocalCarrier();
                const possibleBars = [4, 5, 3, 5, 4]; 
                const secondsIndex = Math.floor(new Date().getSeconds() / 12) % possibleBars.length;
                const mockBars = possibleBars[secondsIndex];
                const percentage = Math.round((mockBars / 5) * 100);
                
                networkStatusEl.textContent = `${carrier} (${mockBars}/5)(${percentage}%)`;
                networkStatusEl.className = "net-sim";
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        
        setInterval(updateNetworkStatus, 4000);
        updateNetworkStatus();

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    gpsStatusEl.textContent = "GPS ON";
                    gpsStatusEl.className = "gps-on";

                    const altitude = position.coords.altitude !== null ? position.coords.altitude : 0;
                    altitudeEl.textContent = formatSixDigits(altitude) + 'm';
                    
                    const speedMPS = position.coords.speed !== null ? position.coords.speed : 0;
                    const speedKMH = speedMPS * 3.6;
                    speedEl.textContent = formatSixDigits(speedKMH) + 'km/h';
                },
                (error) => {
                    gpsStatusEl.textContent = "GPS OFF";
                    gpsStatusEl.className = "gps-off";
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                }
            );
        } else {
            gpsStatusEl.textContent = "GPS OFF";
            gpsStatusEl.className = "gps-off";
        }
    </script>
</body>
</html>
