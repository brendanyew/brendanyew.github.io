<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Altitude and Speed Tracker</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 25px;
            min-width: 340px;
        }
        h1 {
            font-size: 1.4rem;
            color: #000000;
            margin-bottom: 20px;
            margin-top: 0;
            font-weight: bold;
        }
        .status-block {
            margin-bottom: 25px;
            font-size: 1rem;
            font-weight: bold;
            line-height: 1.6;
        }
        .gps-on { color: #00ff00; }
        .gps-off { color: #ff0000; }
        .battery-status { color: #00ff00; }
        .net-no-connect { color: #ff0000; }
        .net-sim { color: #00d2ff; }
        
        .metric {
            font-size: 2.5rem;
            font-weight: bold;
            color: #000000;
            margin: 15px 0;
            letter-spacing: 1px;
        }

        /* Styles units to be capitalized and slightly smaller than the numbers */
        .unit {
            font-size: 1.5rem;
            font-weight: bold;
            margin-left: 2px;
        }
    </style>
</head>
<body>

    <a href="index.html">
        <img src="Logo.png" alt="Brendan's Website">
    </a>
    <div class="container">
        <h1>Your Current Altitude and Speed</h1>
        
        <!-- Status Display Area -->
        <div class="status-block">
            <div id="gps-status" class="gps-off">GPS OFF</div>
            <div class="battery-status">BATTERY SAVING MODE ON</div>
            <div id="network-status" class="net-no-connect">NO CONNECT</div>
        </div>

        <!-- Metrics Area: Defaults to dashes on initial connection state -->
        <div class="metric" id="altitude-display">------<span class="unit">M</span></div>
        <div class="metric" id="speed-display">------<span class="unit">KM/H</span></div>
    </div>

    <script>
        const gpsStatusEl = document.getElementById('gps-status');
        const networkStatusEl = document.getElementById('network-status');
        const altitudeEl = document.getElementById('altitude-display');
        const speedEl = document.getElementById('speed-display');

        // Handles 6-digit layouts securely, supporting negative integer coordinates
        function formatSixDigits(value) {
            let isNegative = value < 0;
            let absoluteRounded = Math.round(Math.abs(value));
            let paddedString = String(absoluteRounded).padStart(6, '0');
            return isNegative ? '-' + paddedString.substring(1) : paddedString;
        }

        // Sets metrics to clean fallback dashes on disconnect
        function setDashesOnDisconnect() {
            altitudeEl.innerHTML = `------<span class="unit">M</span>`;
            speedEl.innerHTML = `------<span class="unit">KM/H</span>`;
        }

        // Checks user-agent characteristics and screen layouts to determine if it is a mobile phone
        function isPhoneDevice() {
            const hasMobileUA = /Mobi|Android|iPhone|iPod/i.test(navigator.userAgent);
            const isSmallScreen = Math.min(window.screen.width, window.screen.height) < 768;
            const hasTouch = ('ontouchstart' in window || navigator.maxTouchPoints > 0);
            
            if (navigator.userAgentData && typeof navigator.userAgentData.mobile === 'boolean') {
                return navigator.userAgentData.mobile && isSmallScreen;
            }
            
            return hasMobileUA || (isSmallScreen && hasTouch);
        }

        // Expanded carrier engine: Evaluates locale to generate variable live tracking outputs
        function detectLocalCarrier() {
            try {
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
                const lang = navigator.language || "";

                // Pick a dynamic array profile based on your region settings
                if (tz.includes("Australia")) {
                    const ausCarriers = ["Optus", "Amaysim", "Telstra", "Vodafone", "Boost"];
                    return ausCarriers[Math.floor(Math.random() * ausCarriers.length)];
                }
                if (tz.includes("America") || lang.includes("en-US")) {
                    const usCarriers = ["Verizon", "T-Mobile", "AT&T"];
                    return usCarriers[Math.floor(Math.random() * usCarriers.length)];
                }
                return "Cellular Network";
            } catch (e) {
                return "Cellular";
            }
        }

        function updateNetworkStatus() {
            if (!navigator.onLine) {
                networkStatusEl.textContent = "NO CONNECT";
                networkStatusEl.className = "net-no-connect";
                return;
            }

            if (!isPhoneDevice()) {
                networkStatusEl.textContent = "NO SERVICE";
                networkStatusEl.className = "net-sim";
                return;
            }

            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            
            if (connection && connection.type && connection.type !== 'cellular') {
                networkStatusEl.textContent = "NO SERVICE";
                networkStatusEl.className = "net-sim";
            } else {
                const carrier = detectLocalCarrier();
                // FIXED BUG: Fully populated structural token elements array safely
                const possibleBars = [5, 4, 3, 5, 4]; 
                const secondsIndex = Math.floor(new Date().getSeconds() / 12) % possibleBars.length;
                const mockBars = possibleBars[secondsIndex];
                const percentage = Math.round((mockBars / 5) * 100);
                
                networkStatusEl.textContent = `${carrier} (${mockBars}/5)(${percentage}%)`;
                networkStatusEl.className = "net-sim";
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        
        setInterval(updateNetworkStatus, 4000);
        updateNetworkStatus();

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    gpsStatusEl.textContent = "GPS ON";
                    gpsStatusEl.className = "gps-on";

                    const altitude = position.coords.altitude !== null ? position.coords.altitude : 0;
                    altitudeEl.innerHTML = `${formatSixDigits(altitude)}<span class="unit">M</span>`;
                    
                    const speedMPS = position.coords.speed !== null && position.coords.speed >= 0 ? position.coords.speed : 0;
                    const speedKMH = speedMPS * 3.6;
                    speedEl.innerHTML = `${formatSixDigits(speedKMH)}<span class="unit">KM/H</span>`;
                },
                (error) => {
                    gpsStatusEl.textContent = "GPS OFF";
                    gpsStatusEl.className = "gps-off";
                    setDashesOnDisconnect();
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                }
            );
        } else {
            gpsStatusEl.textContent = "GPS OFF";
            gpsStatusEl.className = "gps-off";
            setDashesOnDisconnect();
        }
    </script>
</body>
</html>
