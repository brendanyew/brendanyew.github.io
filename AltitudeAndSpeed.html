<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Altitude and Speed Tracker</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 25px;
            min-width: 340px;
        }
        h1 {
            font-size: 1.4rem;
            color: #000000;
            margin-bottom: 20px;
            margin-top: 0;
            font-weight: bold;
        }
        .status-block {
            margin-bottom: 25px;
            font-size: 1rem;
            font-weight: bold;
            line-height: 1.6;
        }
        .gps-on { color: #00ff00; }
        .gps-off { color: #ff0000; }
        .battery-status { color: #00ff00; }
        .net-no-connect { color: #ff0000; }
        .net-sim { color: #00d2ff; }
        
        .metric {
            font-size: 2.5rem;
            font-weight: bold;
            color: #000000;
            margin: 15px 0;
            letter-spacing: 1px;
        }
        .sim-indicator {
            font-size: 0.8rem;
            color: #a0a0a0;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <a href="index.html">
  <img src="Logo.png" alt="Brendan's Website">
</a>    
    <div class="container">
        <h1>Your Current Altitude and Speed</h1>
        
        <!-- Status Display Area -->
        <div class="status-block">
            <div id="gps-status" class="gps-off">GPS OFF</div>
            <div class="battery-status">BATTERY SAVING MODE ON</div>
            <div id="network-status" class="net-no-connect">NO CONNECT</div>
        </div>

        <!-- Metrics Area -->
        <div class="metric" id="altitude-display">000000m</div>
        <div class="metric" id="speed-display">000000km/h</div>
        <div id="mode-indicator" class="sim-indicator"></div>
    </div>

    <script>
        const gpsStatusEl = document.getElementById('gps-status');
        const networkStatusEl = document.getElementById('network-status');
        const altitudeEl = document.getElementById('altitude-display');
        const speedEl = document.getElementById('speed-display');
        const modeIndicatorEl = document.getElementById('mode-indicator');

        let isUsingSimulatedData = false;
        let simAltitude = 24;  // Starting indoor simulation altitude (meters)
        let simSpeed = 0;      // Starting speed

        function formatSixDigits(value) {
            let rounded = Math.max(0, Math.round(value));
            return String(rounded).padStart(6, '0');
        }

        function isPhoneDevice() {
            const hasMobileUA = /Mobi|Android|iPhone|iPod/i.test(navigator.userAgent);
            const isSmallScreen = Math.min(window.screen.width, window.screen.height) < 768;
            const hasTouch = ('ontouchstart' in window || navigator.maxTouchPoints > 0);
            
            if (navigator.userAgentData && typeof navigator.userAgentData.mobile === 'boolean') {
                return navigator.userAgentData.mobile && isSmallScreen;
            }
            return hasMobileUA || (isSmallScreen && hasTouch);
        }

        function detectLocalCarrier() {
            try {
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
                if (tz.includes("Australia")) return "Telstra";
                if (tz.includes("America")) return "Verizon";
                if (tz.includes("Europe/London")) return "EE";
                if (tz.includes("Tokyo")) return "NTT Docomo";
                return "Cellular Network";
            } catch (e) {
                return "Cellular";
            }
        }

        function updateNetworkStatus() {
            if (!navigator.onLine) {
                networkStatusEl.textContent = "NO CONNECT";
                networkStatusEl.className = "net-no-connect";
                return;
            }

            if (!isPhoneDevice()) {
                networkStatusEl.textContent = "NO SERVICE";
                networkStatusEl.className = "net-sim";
                return;
            }

            const carrier = detectLocalCarrier();
            const possibleBars =; 
            const secondsIndex = Math.floor(new Date().getSeconds() / 12) % possibleBars.length;
            const mockBars = possibleBars[secondsIndex];
            const percentage = Math.round((mockBars / 5) * 100);
            
            networkStatusEl.textContent = `${carrier} (${mockBars}/5)(${percentage}%)`;
            networkStatusEl.className = "net-sim";
        }

        // Run simulation math when real hardware fails or is indoors
        function runSimulation() {
            isUsingSimulatedData = true;
            modeIndicatorEl.textContent = "INDOOR HARDWARE FALLBACK ACTIVE";
            
            // Simulating slight altitude shifts (like walking between rooms/floors)
            simAltitude += (Math.random() - 0.5) * 0.5; 
            // Simulating pacing speed around an apartment (0 to 6 km/h)
            simSpeed = 3.5 + (Math.sin(Date.now() / 5000) * 2.5);

            altitudeEl.textContent = formatSixDigits(simAltitude) + 'm';
            speedEl.textContent = formatSixDigits(simSpeed) + 'km/h';
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        
        setInterval(updateNetworkStatus, 4000);
        updateNetworkStatus();

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    const altitude = position.coords.altitude;
                    const speedMPS = position.coords.speed;

                    // If hardware reports absolute zeros, it means you are indoors/stationary. 
                    // Let the simulation smoothly kick in so the app functions.
                    if ((altitude === null || altitude === 0) && (speedMPS === null || speedMPS === 0)) {
                        gpsStatusEl.textContent = "GPS OFF";
                        gpsStatusEl.className = "gps-off";
                        runSimulation();
                    } else {
                        // True outdoor GPS environment detected!
                        isUsingSimulatedData = false;
                        modeIndicatorEl.textContent = ""; 
                        gpsStatusEl.textContent = "GPS ON";
                        gpsStatusEl.className = "gps-on";

                        altitudeEl.textContent = formatSixDigits(altitude) + 'm';
                        const speedKMH = speedMPS * 3.6;
                        speedEl.textContent = formatSixDigits(speedKMH) + 'km/h';
                    }
                },
                (error) => {
                    gpsStatusEl.textContent = "GPS OFF";
                    gpsStatusEl.className = "gps-off";
                    runSimulation();
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 6000
                }
            );
        } else {
            gpsStatusEl.textContent = "GPS OFF";
            gpsStatusEl.className = "gps-off";
            setInterval(runSimulation, 1000);
        }

        // Keep local simulation cycling every second if active
        setInterval(() => {
            if (isUsingSimulatedData) runSimulation();
        }, 1000);
    </script>
</body>
</html>
