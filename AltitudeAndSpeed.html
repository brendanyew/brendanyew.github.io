<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Device Altitude and Speed Tracker</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 650px;
        }
        h1 {
            font-size: 1.4rem;
            color: #000000;
            margin-bottom: 20px;
            margin-top: 0;
            font-weight: bold;
        }
        .status-block {
            margin-bottom: 25px;
            font-size: 1rem;
            font-weight: bold;
            line-height: 1.6;
        }
        .gps-on { color: #00ff00; }
        .gps-off { color: #ff0000; }
        .battery-status { color: #00ff00; }
        .net-no-connect { color: #ff0000; }
        .net-sim { color: #00d2ff; }
        .idle-status { color: #ffff00; }
        
        .dashboard {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 15px 0;
        }
        .metric-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .metric {
            font-size: 2.5rem;
            font-weight: bold;
            color: #000000;
            letter-spacing: 1px;
            line-height: 1.2;
        }
        .metric-secondary {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 1px;
            line-height: 1.2;
            margin: 5px 0;
        }
        .grey-10 { color: #808080; }
        .light-grey-20 { color: #d3d3d3; }
        .unit {
            font-size: 0.65em; 
            font-weight: bold;
            margin-left: 4px;
        }

        @media screen and (min-width: 600px) and (max-width: 1024px) {
            h1 { font-size: 2rem; margin-bottom: 30px; }
            .status-block { font-size: 1.25rem; margin-bottom: 40px; }
            .dashboard { gap: 80px; }
            .metric { font-size: 4rem; letter-spacing: 2px; }
            .metric-secondary { font-size: 2.8rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <a href="index.html">
  <img src="Logo.png" alt="Brendan's Website">
</a>
    <div class="container">
        <h1>Your Current Altitude and Speed</h1>
        
        <div class="status-block">
            <div id="gps-status" class="gps-off">GPS OFF</div>
            <div class="battery-status">BATTERY SAVING MODE ON</div>
            <div id="network-status" class="net-no-connect">NO CONNECT</div>
            <div id="idle-status" class="idle-status" style="display: none;">IDLE MODE ON</div>
        </div>

        <div class="dashboard">
            <!-- Speed Column (Left) -->
            <div class="metric-column" id="speed-column">
                <div class="metric-secondary light-grey-20">+20<span class="unit">KM/H</span></div>
                <div class="metric-secondary grey-10">+10<span class="unit">KM/H</span></div>
                <div class="metric">------<span class="unit">KM/H</span></div>
                <div class="metric-secondary grey-10">-10<span class="unit">KM/H</span></div>
                <div class="metric-secondary light-grey-20">-20<span class="unit">KM/H</span></div>
            </div>

            <!-- Altitude Column (Right) -->
            <div class="metric-column" id="altitude-column">
                <div class="metric-secondary light-grey-20">+20<span class="unit">M</span></div>
                <div class="metric-secondary grey-10">+10<span class="unit">M</span></div>
                <div class="metric">------<span class="unit">M</span></div>
                <div class="metric-secondary grey-10">-10<span class="unit">M</span></div>
                <div class="metric-secondary light-grey-20">-20<span class="unit">M</span></div>
            </div>
        </div>
    </div>

    <script>
        const gpsStatusEl = document.getElementById('gps-status');
        const networkStatusEl = document.getElementById('network-status');
        const idleStatusEl = document.getElementById('idle-status');
        const speedColumn = document.getElementById('speed-column');
        const altitudeColumn = document.getElementById('altitude-column');

        let liveGpsActive = false;

        function formatSixDigits(value) {
            let isNegative = value < 0;
            let absValue = Math.abs(Math.round(value));
            let padded = String(absValue).padStart(6, '0');
            return (isNegative ? '-' : '') + padded;
        }

        function renderColumn(element, currentValue, unit) {
            if (!liveGpsActive) {
                element.innerHTML = '<div class="metric-secondary light-grey-20">+20<span class="unit">' + unit + '</span></div>' +
                    '<div class="metric-secondary grey-10">+10<span class="unit">' + unit + '</span></div>' +
                    '<div class="metric">------<span class="unit">' + unit + '</span></div>' +
                    '<div class="metric-secondary grey-10">-10<span class="unit">' + unit + '</span></div>' +
                    '<div class="metric-secondary light-grey-20">-20<span class="unit">' + unit + '</span></div>';
                return;
            }

            let current = Math.round(currentValue);
            let baseBelow = Math.floor(current / 10) * 10;
            let baseAbove = Math.ceil(current / 10) * 10;

            if (baseBelow === baseAbove) {
                baseAbove += 10;
                baseBelow -= 10;
            }

            let plus10 = baseAbove;
            let plus20 = baseAbove + 10;
            let minus10 = baseBelow;
            let minus20 = baseBelow - 10;

            element.innerHTML = '<div class="metric-secondary light-grey-20">' + formatSixDigits(plus20) + '<span class="unit">' + unit + '</span></div>' +
                '<div class="metric-secondary grey-10">' + formatSixDigits(plus10) + '<span class="unit">' + unit + '</span></div>' +
                '<div class="metric">' + formatSixDigits(current) + '<span class="unit">' + unit + '</span></div>' +
                '<div class="metric-secondary grey-10">' + formatSixDigits(minus10) + '<span class="unit">' + unit + '</span></div>' +
                '<div class="metric-secondary light-grey-20">' + formatSixDigits(minus20) + '<span class="unit">' + unit + '</span></div>';
        }

        function isPhoneDevice() {
            const hasMobileUA = /Mobi|Android|iPhone|iPod/i.test(navigator.userAgent);
            const isSmallScreen = Math.min(window.screen.width, window.screen.height) < 768;
            const hasTouch = ('ontouchstart' in window || navigator.maxTouchPoints > 0);
            
            if (navigator.userAgentData && typeof navigator.userAgentData.mobile === 'boolean') {
                return navigator.userAgentData.mobile && isSmallScreen;
            }
            return hasMobileUA || (isSmallScreen && hasTouch);
        }

        function detectLocalCarrier() {
            try {
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
                if (tz.includes("Australia")) return "Telstra";
                if (tz.includes("Asia/Saigon") || tz.includes("Ho_Chi_Minh") || navigator.language.includes("vi")) return "Viettel";
                if (tz.includes("America")) return "Verizon";
                if (tz.includes("Europe/London")) return "EE";
                if (tz.includes("Tokyo")) return "NTT Docomo";
                return "Cellular Network";
            } catch (e) {
                return "Cellular";
            }
        }

        function updateNetworkStatus() {
            if (!navigator.onLine) {
                networkStatusEl.textContent = "NO CONNECT";
                networkStatusEl.className = "net-no-connect";
                return;
            }

            if (!isPhoneDevice()) {
                networkStatusEl.textContent = "NO SERVICE";
                networkStatusEl.className = "net-sim";
                return;
            }

            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            
            if (connection && connection.type && connection.type !== 'cellular') {
                networkStatusEl.textContent = "NO SERVICE";
                networkStatusEl.className = "net-sim";
            } else {
                const carrier = detectLocalCarrier();
                const barsArray =;
                const secondsIndex = Math.floor(new Date().getSeconds() / 12) % barsArray.length;
                const mockBars = barsArray[secondsIndex];
                const percentage = Math.round((mockBars / 5) * 100);
                
                networkStatusEl.textContent = carrier + " (" + mockBars + "/5) (" + percentage + "%)";
                networkStatusEl.className = "net-sim";
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        
        setInterval(updateNetworkStatus, 4000);
        updateNetworkStatus();

        idleStatusEl.style.display = 'block';

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    liveGpsActive = true;
                    gpsStatusEl.textContent = "GPS ON";
                    gpsStatusEl.className = "gps-on";

                    const altitude = position.coords.altitude !== null ? position.coords.altitude : 0;
                    renderColumn(altitudeColumn, altitude, 'M');
                    
const speedMPS = position.coords.speed !== null ? position.coords.speed : 0;
const speedKMH = speedMPS * 3.6;
renderColumn(speedColumn, speedKMH, 'KM/H');
if (Math.round(speedKMH) === 0) {
idleStatusEl.style.display = 'block';
} else {
idleStatusEl.style.display = 'none';
}
},
(error) => {
liveGpsActive = false;
gpsStatusEl.textContent = "GPS OFF";
gpsStatusEl.className = "gps-off";
idleStatusEl.style.display = 'block';
renderColumn(altitudeColumn, 0, 'M');
renderColumn(speedColumn, 0, 'KM/H');
},
{
enableHighAccuracy: true,
maximumAge: 0,
timeout: 10000
}
);
} else {
liveGpsActive = false;
gpsStatusEl.textContent = "GPS OFF";
gpsStatusEl.className = "gps-off";
idleStatusEl.style.display = 'block';
renderColumn(altitudeColumn, 0, 'M');
renderColumn(speedColumn, 0, 'KM/H');
}
                        },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                }
            );
        } else {
            liveGpsActive = false;
            gpsStatusEl.textContent = "GPS OFF";
            gpsStatusEl.className = "gps-off";
            idleStatusEl.style.display = 'block';
            renderColumn(altitudeColumn, 0, 'M');
            renderColumn(speedColumn, 0, 'KM/H');
        }
    </script>
</body>
</html>
