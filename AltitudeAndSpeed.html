<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Device Altitude and Speed Tracker</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 650px;
        }
        h1 {
            font-size: 1.4rem;
            color: #000000;
            margin-bottom: 20px;
            margin-top: 0;
            font-weight: bold;
        }
        .status-block {
            margin-bottom: 25px;
            font-size: 1rem;
            font-weight: bold;
            line-height: 1.6;
        }
        .gps-on { color: #00ff00; }
        .gps-off { color: #ff0000; }
        .battery-status { color: #00ff00; }
        .net-no-connect { color: #ff0000; }
        .net-sim { color: #00d2ff; }
        .idle-status { color: #ffff00; }
        
        .dashboard {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 15px 0;
        }
        .metric-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .metric {
            font-size: 2.5rem;
            font-weight: bold;
            color: #000000;
            letter-spacing: 1px;
            line-height: 1.2;
        }
        .metric-secondary {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 1px;
            line-height: 1.2;
            margin: 5px 0;
        }
        .grey-10 {
            color: #808080;
        }
        .light-grey-20 {
            color: #d3d3d3;
        }
        .unit {
            font-size: 0.65em; 
            font-weight: bold;
            margin-left: 4px;
        }

        @media screen and (min-width: 600px) and (max-width: 1024px) {
            h1 {
                font-size: 2rem;
                margin-bottom: 30px;
            }
            .status-block {
                font-size: 1.25rem;
                margin-bottom: 40px;
            }
            .dashboard {
                gap: 80px;
            }
            .metric {
                font-size: 4rem;
                letter-spacing: 2px;
            }
            .metric-secondary {
                font-size: 2.8rem;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <a href="index.html">
  <img src="Logo.png" alt="Brendan's Website">
</a>
    <div class="container">
        <h1>Your Current Altitude and Speed</h1>
        
        <div class="status-block">
            <div id="gps-status" class="gps-off">GPS OFF</div>
            <div class="battery-status">BATTERY SAVING MODE ON</div>
            <div id="network-status" class="net-no-connect">NO CONNECT</div>
            <div id="idle-status" class="idle-status" style="display: none;">IDLE MODE ON</div>
        </div>

        <div class="dashboard">
            <!-- Speed Column (Left) -->
            <div class="metric-column" id="speed-column">
                <div class="metric-secondary light-grey-20">+20<span class="unit">KM/H</span></div>
                <div class="metric-secondary grey-10">+10<span class="unit">KM/H</span></div>
                <div class="metric">------<span class="unit">KM/H</span></div>
                <div class="metric-secondary grey-10">-10<span class="unit">KM/H</span></div>
                <div class="metric-secondary light-grey-20">-20<span class="unit">KM/H</span></div>
            </div>

            <!-- Altitude Column (Right) -->
            <div class="metric-column" id="altitude-column">
                <div class="metric-secondary light-grey-20">+20<span class="unit">M</span></div>
                <div class="metric-secondary grey-10">+10<span class="unit">M</span></div>
                <div class="metric">------<span class="unit">M</span></div>
                <div class="metric-secondary grey-10">-10<span class="unit">M</span></div>
                <div class="metric-secondary light-grey-20">-20<span class="unit">M</span></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
