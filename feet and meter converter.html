<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Length Converter (Feet & Meters)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
            color: #24292f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .converter-card {
            background-color: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 3px 6px rgba(140,149,159,0.15);
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            font-weight: 600;
            border-bottom: 1px solid #d0d7de;
            padding-bottom: 8px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 14px;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px 12px;
            font-size: 16px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: #f6f8fa;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #0969da;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(9,105,218,0.3);
        }
        .info-text {
            font-size: 12px;
            color: #57606a;
            margin-top: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="converter-card">
    <h2>Length Converter</h2>
    
    <div class="input-group">
        <label for="feet">Feet (ft)</label>
        <input type="number" id="feet" placeholder="Enter feet" step="any" oninput="convertFeetToMeters()">
    </div>

    <div class="input-group">
        <label for="meters">Meters (m)</label>
        <input type="number" id="meters" placeholder="Enter meters" step="any" oninput="convertMetersToFeet()">
    </div>

    <div class="info-text">
        Values update instantly as you type.
    </div>
</div>

<script>
    // 1 foot = 0.3048 meters
    const FT_TO_M = 0.3048;

    function convertFeetToMeters() {
        const feetInput = document.getElementById('feet');
        const metersInput = document.getElementById('meters');
        
        if (feetInput.value === '') {
            metersInput.value = '';
            return;
        }
        
        const feet = parseFloat(feetInput.value);
        const meters = feet * FT_TO_M;
        // Limit to 4 decimal places for clean formatting
        metersInput.value = Number(meters.toFixed(4));
    }

    function convertMetersToFeet() {
        const feetInput = document.getElementById('feet');
        const metersInput = document.getElementById('meters');
        
        if (metersInput.value === '') {
            feetInput.value = '';
            return;
        }
        
        const meters = parseFloat(metersInput.value);
        const feet = meters / FT_TO_M;
        // Limit to 4 decimal places for clean formatting
        feetInput.value = Number(feet.toFixed(4));
    }
</script>

</body>
</html>
